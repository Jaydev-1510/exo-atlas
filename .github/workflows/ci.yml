name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
      SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v5
        with:
          node-version: 22
          install: true
          build: false

      - name: Type check
        run: bun astro check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
